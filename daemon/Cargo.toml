[package]
name = "luminad"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"      # size optimized
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.aarch64-linux-android]
linker = "aarch64-linux-android34-clang"

[package]
name = "luminad"
version = "2.3.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "luminad_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
obfstr = "0.4"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"

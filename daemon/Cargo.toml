[package]
name = "luminad"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = "z"     # Optimasi ukuran binary
lto = true          # Link-Time Optimization
codegen-units = 1
panic = "abort"
strip = true        # Buang debug symbols

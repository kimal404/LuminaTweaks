name: Build & Sign Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x manager/gradlew

      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "
          import os, base64
          raw = os.environ['KEYSTORE_BASE64'].strip().replace('\r', '').replace('\n', '').replace(' ', '')
          padding = (-len(raw)) % 4
          if padding:
              raw += '=' * padding
          with open('lumina-release.jks', 'wb') as f:
              f.write(base64.b64decode(raw))
          "
            echo "KEYSTORE_SOURCE=secret" >> $GITHUB_ENV
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, generating fallback temporary keystore."
            keytool -genkey -v -keystore lumina-release.jks -alias LuminaTweaks021 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LuminaTweaks, OU=Development, O=Lumina, L=Jakarta, ST=Jakarta, C=ID" \
              -storepass LuminaTweaks021 -keypass LuminaTweaks021
            echo "KEYSTORE_SOURCE=temp" >> $GITHUB_ENV
          fi

      - name: Verify Keystore Integrity
        run: |
          keytool -list -v -keystore lumina-release.jks -storepass LuminaTweaks021 -alias LuminaTweaks021

      - name: Compile Release APK
        working-directory: manager
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Sign & Align APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          mkdir -p dist
          find manager/app/build/outputs/apk -name "*.apk" | while read -r apk; do
            if [[ "$apk" == *"unsigned"* ]]; then
              base_name=$(basename "${apk%-unsigned.apk}")
              aligned="dist/${base_name}-aligned.apk"
              signed="dist/${base_name}-signed.apk"
              $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "$aligned"
              $BUILD_TOOLS_DIR/apksigner sign --ks lumina-release.jks --ks-pass pass:LuminaTweaks021 --ks-key-alias LuminaTweaks021 --key-pass pass:LuminaTweaks021 --out "$signed" "$aligned"
              rm -f "$aligned"
              echo "Successfully signed: $signed"
            else
              cp "$apk" dist/
            fi
          done

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaTweaks-Release-Signed
          path: dist/*.apk
          if-no-files-found: error

      - name: Send Build to Telegram Channel
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_RAW_MSG: ${{ github.event.head_commit.message }}
        run: |
          TARGET_FILE=$(find . -type f -name "*.apk" | grep -v "unaligned" | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "[!] File APK hasil build tidak ditemukan!"
            exit 1
          fi

          echo "[*] Mengirim file: $TARGET_FILE"
          WORKFLOW_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          # Escape karakter HTML agar entity parser Telegram tidak error
          SAFE_MSG=$(echo "$COMMIT_RAW_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="<b>LuminaTweaks</b>
          #ci_${RUN_NUM}

          <pre>${SAFE_MSG}</pre>

          <a href=\"${COMMIT_URL}\">Commit</a>
          <a href=\"${WORKFLOW_URL}\">Workflow run</a>"

          # Gunakan --form-string agar @ di username channel tidak dianggap sebagai file path
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            --form-string chat_id="${CHAT_ID}" \
            -F document=@"${TARGET_FILE}" \
            --form-string caption="${CAPTION}" \
            --form-string parse_mode="HTML")

          echo "Response Telegram: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":false'; then
            exit 1
          fi

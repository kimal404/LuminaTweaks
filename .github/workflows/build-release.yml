name: Build & Sign Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Daemon, Manager & Sign Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust & Compile luminad
        run: |
          rustup target add aarch64-linux-android
          NDK_BIN=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH="$NDK_BIN:$PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cd daemon
          cargo build --target aarch64-linux-android --release
          cd ..

          mkdir -p manager/app/src/main/assets/bin
          cp daemon/target/aarch64-linux-android/release/luminad manager/app/src/main/assets/bin/luminad
          chmod 755 manager/app/src/main/assets/bin/luminad

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x manager/gradlew

      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "[-] Error: Secret KEYSTORE_BASE64 tidak ditemukan!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > lumina-release.jks

      - name: Compile Release APK
        working-directory: manager
        run: ./gradlew clean assembleRelease

      - name: Sign & Align APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          mkdir -p dist
          find manager/app/build/outputs/apk/release -name "*.apk" | while read -r apk; do
            base_name=$(basename "$apk" .apk)
            aligned="dist/${base_name}-aligned.apk"
            signed="dist/${base_name}-signed.apk"
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "$aligned" || cp "$apk" "$aligned"
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks lumina-release.jks \
              --ks-pass "pass:${KS_PASS}" \
              --ks-key-alias "${KS_ALIAS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$signed" "$aligned"
            rm -f "$aligned"
            echo "Successfully signed: $signed"
          done
          # Hapus file keystore dari runner segera setelah signing selesai
          rm -f lumina-release.jks

      - name: Package Flashable ZIP Module
        if: success()
        run: |
          mkdir -p dist
          SHORT_SHA=$(git rev-parse --short HEAD)

          MOD_VER=$(grep "^version=" module/module.prop 2>/dev/null | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$MOD_VER" ]; then
            MOD_VER="v2.0.2"
          fi
          case "$MOD_VER" in
            v*|V*) ;;
            *) MOD_VER="v${MOD_VER}" ;;
          esac

          ZIP_NAME="LuminaTweaks-${MOD_VER}-ci${{ github.run_number }}-${SHORT_SHA}.zip"
          ZIP_TARGET="${GITHUB_WORKSPACE}/dist/${ZIP_NAME}"

          mkdir -p build_module
          if [ -d "module" ]; then
            cp -r module/* build_module/
          fi

          rm -rf build_module/system build_module/webroot build_module/common

          cp daemon/target/aarch64-linux-android/release/luminad build_module/luminad
          chmod 755 build_module/luminad

          APK_FILE=$(ls dist/*-signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "Mengemas APK ke dalam modul: $APK_FILE"
          cp "$APK_FILE" build_module/manager.apk

          cd build_module
          zip -r9 "$ZIP_TARGET" ./*
          cd ..

          echo "ZIP_PATH=dist/${ZIP_NAME}" >> $GITHUB_ENV

      - name: Send Build to Telegram Channel
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_RAW_MSG: ${{ github.event.head_commit.message }}
        run: |
          TARGET_FILE="${ZIP_PATH}"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "[!] File ZIP flashable tidak ditemukan!"
            exit 1
          fi

          WORKFLOW_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          SAFE_MSG=$(echo "$COMMIT_RAW_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="<b>LuminaTweaks</b>
          #ci_${RUN_NUM}

          <pre>${SAFE_MSG}</pre>

          <a href=\"${COMMIT_URL}\">Commit</a>
          <a href=\"${WORKFLOW_URL}\">Workflow run</a>"

          THUMB_ARG=""
          if [ -f "thumb.jpg" ]; then
            THUMB_ARG="-F thumbnail=@thumb.jpg"
          elif [ -f "thumb.png" ]; then
            THUMB_ARG="-F thumbnail=@thumb.png"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            --form-string chat_id="${CHAT_ID}" \
            -F document=@"${TARGET_FILE}" \
            $THUMB_ARG \
            --form-string caption="${CAPTION}" \
            --form-string parse_mode="HTML"
